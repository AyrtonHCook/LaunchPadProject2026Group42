<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ladywood Support Page — Driver Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/driver.css">
</head>
<body class="dashboard-page">

  <header class="topbar">
    <div class="topbar__logo">
      <span>🚛</span>
      <span class="topbar__logo-name">Ladywood Support Page</span>
    </div>
    <div class="topbar__driver-info">
      <span id="headerDriverName"></span>
      <span id="headerTruckName"></span>
      <span class="header-pill header-pill--active" id="headerStatus"></span>
      <span class="header-pill header-pill--food"   id="headerFood"></span>
      <span class="header-pill header-pill--water"  id="headerWater"></span>
    </div>
    <button id="logoutButton" class="topbar__logout">Logout</button>
  </header>

  <main class="dashboard-main">

    <section class="panel">
      <h2 id="driverName">Driver Name</h2>
      <p id="truckName"></p>
      <p id="truckLocation"></p>
      <p id="truckStatus"></p>
    </section>

    <section class="panel">
      <h2>Truck Map</h2>
      <div id="map"></div>
    </section>

    <section class="panel">
      <h2>Update Stock</h2>
      <form id="stockForm">
        <div class="form-group">
          <label for="foodStock">Food stock</label>
          <input type="number" id="foodStock" min="0" required>
        </div>
        <div class="form-group">
          <label for="waterStock">Water stock</label>
          <input type="number" id="waterStock" min="0" required>
        </div>
        <button type="submit">Update Stock</button>
      </form>
      <p id="stockMessage" class="feedback-msg"></p>
    </section>

    <section class="panel">
      <h2>Truck Status</h2>
      <div class="btn-row">
        <button id="setActiveButton">Set Active</button>
        <button id="setInactiveButton">Set Inactive</button>
      </div>
      <p id="statusMessage" class="feedback-msg"></p>
    </section>

    <section class="panel">
      <h2>Restock Locations</h2>
      <ul id="restockList">
        <li>Loading restock locations...</li>
      </ul>
    </section>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/driverDash.js"></script>

</body>
</html>
