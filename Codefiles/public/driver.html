<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Page</title>

  <link rel="stylesheet" href="/css/driver.css">  

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
</head>
<body>

  <h1>Driver dashboard</h1>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Driver Login</h2>

      <form id="driverLoginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
      </form>

      <p id="loginMessage"></p>
    </div>
  </div>

  <main id="driverDashboard" style="display: none;">

    <section>
      <h2 id="driverName">Driver Name</h2>
      <p id="truckName">Truck Name</p>
      <p id="truckLocation">Truck Location</p>
      <p id="truckStatus">Status</p>
    </section>

    <section>
      <h2>Truck Map</h2>

      <div id="map"></div>
    </section>

    <section>
      <h2>Update Truck Stock</h2>

      <form id="stockForm">
        <label for="foodStock">Food stock</label>
        <input type="number" id="foodStock" min="0" required>

        <label for="waterStock">Water stock</label>
        <input type="number" id="waterStock" min="0" required>

        <button type="submit">Update Stock</button>
      </form>

      <p id="stockMessage"></p>
    </section>

    <section>
      <h2>Truck Status</h2>

      <button id="setActiveButton">Set Active</button>
      <button id="setInactiveButton">Set Inactive</button>

      <p id="statusMessage"></p>
    </section>

    <section>
      <h2>Restock Locations</h2>

      <ul id="restockList">
        <li>Restock locations will load here</li>
      </ul>
    </section>

    <button id="logoutButton">Logout</button>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="/js/driver.js"></script>
</body>
</html>
