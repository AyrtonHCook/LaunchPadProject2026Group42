<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ladywood Support Page — Driver Login</title>
  <link rel="stylesheet" href="/css/driver.css">
</head>
<body class="login-page">

  <header class="topbar">
    <div class="topbar__logo">
      <span>🚛</span>
      <span class="topbar__logo-name">Ladywood Support Page</span>
    </div>
    <a class="topbar__back" href="/">← User view</a>
  </header>

  <main class="login-main">
    <div class="login-card">
      <h1 class="login-card__title">Driver Login</h1>
      <p class="login-card__sub">Sign in to access your truck dashboard.</p>

      <form id="driverLoginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="your@email.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit">Sign in</button>
      </form>

      <p id="loginMessage" class="login-message"></p>
      <p class="login-card__footer">
        Need a driver account?
        <a href="/driverRegister.html">Register here</a>
      </p>
    </div>
  </main>

  <script src="/js/driverlogin.js"></script>

</body>
</html>
